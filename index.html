<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokedex XP – Pokémon Legends: Z-A</title>
<meta name="description" content="Pokedex XP — คู่มือ Pokémon Legends: Z-A (รวม Mega Dimension DLC) สำหรับมือใหม่ ดีไซน์แบบ Windows XP/98 — นิสัย เพศ วิวัฒนาการ ท่าที่ดีที่สุดและท่าที่เรียนได้ ปุ่ม A/B/X/Y ธาตุ และการเทรน IV/EV">
<link rel="icon" href="img/ico_pokedex.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot" aria-label="Loading">
  <div class="bootbox">
    <div class="bootlogo"><span class="ball"></span><div><div class="bt1">Pokedex<em>XP</em></div><div class="bt2">Pokémon&nbsp;Legends:&nbsp;Z-A</div></div></div>
    <div class="pbarwrap"><div class="pbar" id="pbar"></div><span id="pct">0%</span></div>
    <div class="runway" id="runway"></div>
  </div>
  <div class="bootfoot">Copyright © fan project · click to skip</div>
</div>
<div id="desktop">
  <div id="icons" role="toolbar" aria-label="ไอคอนเดสก์ท็อป"></div>
</div>
<div id="startmenu" class="menu" role="menu" aria-label="เมนู Start"></div>
<div id="vermenu" class="menu" role="menu" aria-label="Game version"></div>
<div id="taskbar">
  <button id="start" aria-haspopup="true" aria-expanded="false"><span class="flag"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>start</button>
  <div id="tasks" role="list"></div>
  <div id="tray"><button id="favbtn" class="trbtn" title="รายการโปรด"></button><button id="themebtn" class="trbtn" title="Theme"></button><button id="verbtn" class="trbtn" title="Game version">🎮 <span class="vl">Pokémon Legends: Z-A</span> ▾</button><button id="verbadge" class="trbtn vbadge" title="Version"></button><span class="clk" id="clock"></span></div>
</div>
<noscript><p style="position:fixed;top:40%;left:0;right:0;text-align:center;color:#fff">ต้องเปิด JavaScript เพื่อใช้งานเว็บนี้</p></noscript>
<script src="data/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
